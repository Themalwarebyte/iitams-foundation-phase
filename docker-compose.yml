# ---------------------------------------------------------------------------
# IITAMS — Docker Compose for self-hosted deployments
#
# Web tier: stateless static SPA behind nginx. Point VITE_CONVEX_URL at your
# Convex deployment (self-hosted or managed) and rebuild.
#
# DATASTORE POLICY: Convex is the single transactional system of record. The
# `postgres` service below is RESERVED/OPTIONAL (profile `reporting`) for a
# future analytics mirror — it is NOT part of the default deployment and holds
# no application data. Do not treat it as a second source of truth.
#
# Usage:
#   VITE_CONVEX_URL=https://<your-deployment>.convex.cloud docker compose up -d --build
# Optional analytics store (explicit opt-in only):
#   docker compose --profile reporting up -d
# ---------------------------------------------------------------------------

services:
  web:
    build:
      context: .
      args:
        VITE_CONVEX_URL: ${VITE_CONVEX_URL:?Set VITE_CONVEX_URL to your Convex deployment URL}
    image: iitams-web:latest
    restart: unless-stopped
    ports:
      - "8080:80"
    # The SPA itself is stateless; mount a volume if you add local artefacts
    # (e.g. nginx TLS material terminated here instead of at the proxy).
    volumes:
      - web-logs:/var/log/nginx
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3

  # ---------------------------------------------------------------------------
  # RESERVED / OPTIONAL — future reporting/integration mirror (Phase 3+).
  # NOT started by default (`docker compose --profile reporting up -d`).
  # The transactional system of record remains Convex; this service must never
  # hold authoritative application data. Password comes from a secrets file
  # you create (`secrets/pg_password.txt`) — never inline credentials here.
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    profiles: ["reporting"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: iitams_reporting
      POSTGRES_USER: iitams
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_password
    secrets:
      - pg_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iitams -d iitams_reporting"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  web-logs:

secrets:
  pg_password:
    file: ./secrets/pg_password.txt
