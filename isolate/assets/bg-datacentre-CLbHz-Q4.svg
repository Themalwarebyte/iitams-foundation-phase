<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" fill="none">
  <!--
    IITAMS original artwork — abstract data-centre corridor with rack lights.
    License: created for the IITAMS project (original work, no third-party
    rights). Deliberately abstract: no official government marks.
  -->
  <defs>
    <linearGradient id="hall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A3140"/>
      <stop offset="55%" stop-color="#0C3D49"/>
      <stop offset="100%" stop-color="#004E98" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="floorGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4EB5F5" stop-opacity="0"/>
      <stop offset="100%" stop-color="#4EB5F5" stop-opacity="0.18"/>
    </linearGradient>
    <radialGradient id="vanish" cx="0.5" cy="0.42" r="0.35">
      <stop offset="0%" stop-color="#4EB5F5" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#4EB5F5" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#hall)"/>
  <rect width="1920" height="1080" fill="url(#vanish)"/>

  <!-- perspective floor -->
  <path d="M0 1080 L760 620 L1160 620 L1920 1080 Z" fill="url(#floorGlow)"/>
  <g stroke="#9EC9E8" stroke-opacity="0.14" stroke-width="1.4">
    <path d="M0 1080 L810 620"/><path d="M240 1080 L860 620"/>
    <path d="M480 1080 L910 620"/><path d="M720 1080 L960 620"/>
    <path d="M960 1080 L960 620"/><path d="M1200 1080 L1010 620"/>
    <path d="M1440 1080 L1060 620"/><path d="M1680 1080 L1110 620"/>
    <path d="M1920 1080 L1160 620"/>
  </g>
  <g stroke="#9EC9E8" stroke-opacity="0.10" stroke-width="1.2">
    <path d="M760 700 L1160 700"/><path d="M680 790 L1240 790"/>
    <path d="M560 900 L1360 900"/><path d="M380 1010 L1540 1010"/>
  </g>

  <!-- rack rows (left & right) -->
  <g fill="#0A2E3C" stroke="#9EC9E8" stroke-opacity="0.22" stroke-width="1.5">
    <rect x="60" y="180" width="200" height="520" rx="8"/>
    <rect x="300" y="260" width="170" height="470" rx="8"/>
    <rect x="510" y="330" width="140" height="420" rx="8"/>
    <rect x="1660" y="180" width="200" height="520" rx="8"/>
    <rect x="1450" y="260" width="170" height="470" rx="8"/>
    <rect x="1270" y="330" width="140" height="420" rx="8"/>
  </g>

  <!-- rack status lights -->
  <g fill="#4EB5F5">
    <circle cx="110" cy="240" r="4" fill-opacity="0.9"/><circle cx="150" cy="240" r="4" fill-opacity="0.45"/>
    <circle cx="110" cy="300" r="4" fill-opacity="0.6"/><circle cx="190" cy="300" r="4" fill-opacity="0.85"/>
    <circle cx="110" cy="360" r="4" fill-opacity="0.5"/><circle cx="150" cy="420" r="4" fill-opacity="0.8"/>
    <circle cx="190" cy="480" r="4" fill-opacity="0.55"/><circle cx="110" cy="540" r="4" fill-opacity="0.75"/>
    <circle cx="350" cy="320" r="4" fill-opacity="0.8"/><circle cx="390" cy="380" r="4" fill-opacity="0.5"/>
    <circle cx="430" cy="440" r="4" fill-opacity="0.85"/><circle cx="350" cy="500" r="4" fill-opacity="0.6"/>
    <circle cx="550" cy="390" r="4" fill-opacity="0.7"/><circle cx="590" cy="470" r="4" fill-opacity="0.5"/>
    <circle cx="550" cy="550" r="4" fill-opacity="0.85"/>
    <circle cx="1710" cy="240" r="4" fill-opacity="0.85"/><circle cx="1750" cy="300" r="4" fill-opacity="0.5"/>
    <circle cx="1790" cy="360" r="4" fill-opacity="0.75"/><circle cx="1710" cy="480" r="4" fill-opacity="0.55"/>
    <circle cx="1500" cy="330" r="4" fill-opacity="0.8"/><circle cx="1540" cy="410" r="4" fill-opacity="0.55"/>
    <circle cx="1580" cy="490" r="4" fill-opacity="0.8"/><circle cx="1320" cy="390" r="4" fill-opacity="0.7"/>
    <circle cx="1360" cy="470" r="4" fill-opacity="0.5"/><circle cx="1320" cy="550" r="4" fill-opacity="0.85"/>
  </g>
  <g fill="#FFD900" fill-opacity="0.85">
    <circle cx="150" cy="330" r="3.5"/><circle cx="390" cy="320" r="3.5"/>
    <circle cx="1750" cy="240" r="3.5"/><circle cx="1540" cy="330" r="3.5"/>
  </g>

  <!-- cool-room ceiling strip lights -->
  <g fill="#C2E9FF" fill-opacity="0.16">
    <rect x="700" y="120" width="520" height="10" rx="5"/>
    <rect x="760" y="180" width="400" height="8" rx="4"/>
    <rect x="820" y="240" width="280" height="6" rx="3"/>
  </g>
</svg>
