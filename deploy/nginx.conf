# IITAMS — nginx site configuration for self-hosted deployments
# Serves the static SPA from /usr/share/nginx/html with SPA fallback routing,
# secure headers and gzip compression.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # --- Security headers ---------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Set a meaningful CSP once integration endpoints are finalised, e.g.:
    # add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https://*.convex.cloud;" always;

    # --- Compression ----------------------------------------------------------
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # --- Static assets ----------------------------------------------------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Favicon / manifest
    location = /logo.svg {
        expires 7d;
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        expires 7d;
        try_files $uri =404;
    }

    # --- SPA fallback ----------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
